<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Die goldenen Dreißiger</title>
  <meta name="description" content="Alle Infos zur Feier, Essensauswahl und Kindheitsfotos.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#6b1324">
  <link rel="icon" href="/img/icon.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.json?v=2">
  <meta name="apple-mobile-web-app-title" content="Goldene 30er">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="intro" class="intro" role="dialog" aria-modal="true" aria-labelledby="intro-title" hidden>
    <div class="stage" aria-hidden="true">
      <figure class="intro-video">
        <video id="intro-video" src="/img/konfetti.mp4" poster="/img/konfetti-poster.jpg" playsinline preload="auto"></video>
      </figure>
    </div>
    <div class="curtain left" aria-hidden="true"></div>
    <div class="curtain right" aria-hidden="true"></div>
    <div class="valance" aria-hidden="true"></div>
    <div class="intro-inner">
      <img class="intro-logo" src="/img/logo.svg?v=2" alt="">
      <h1 class="intro-title" id="intro-title">Die goldenen Dreißiger</h1>
      <p class="intro-lead" id="intro-lead">Sophie &amp; Anne werden 30 – und ihr seid eingeladen.</p>
      <button type="button" id="fire" class="cannon">
        <span class="cannon-ring" aria-hidden="true"></span>
        <span class="cannon-label">Konfetti zünden</span>
      </button>
      <p class="intro-hint">Am besten mit Ton 🔊</p>
    </div>
    <button type="button" id="skip-intro" class="skip">Überspringen</button>
  </div>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <div class="flash" aria-hidden="true"></div>

  <header class="hero">
    <div class="hero-inner">
      <div class="strip" aria-hidden="true">
        <div class="frame"><img src="/img/wir-schnee.jpg" alt=""></div>
        <div class="frame digit">3</div>
        <div class="frame"><img src="/img/wir-strand.jpg" alt=""></div>
        <div class="frame digit">0</div>
        <div class="caption" id="strip-caption">Frankfurt am Main</div>
      </div>
      <div class="hero-text">
        <img class="hero-logo" src="/img/logo.svg?v=2" alt="">
        <h1 id="title">Die goldenen Dreißiger</h1>
        <p class="hosts" id="hosts"></p>
        <p class="when" id="when"></p>
        <p class="countdown" id="countdown"></p>
        <nav aria-label="Abschnitte">
          <a href="#infos">Infos</a>
          <a href="#essen">Essen wählen</a>
          <button type="button" id="again" class="again">Nochmal Konfetti 🎉</button>
        </nav>
      </div>
    </div>
  </header>

  <main id="app">
    <p class="loading">Einen Moment, die Infos werden geladen …</p>
  </main>

  <footer>Die goldenen Dreißiger · Sophie &amp; Anne · 2026</footer>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/confetti.js"></script>
  <script src="/app.js"></script>
</body>
</html>
